# The test JVM runs on the host, so it uses the published port.
api.baseUri=http://localhost:8080/parabank/services/bank

# The browser runs inside a Grid container, where localhost means the container itself.
# So it uses the Compose service name.
ui.baseUrl=http://parabank:8080/parabank

# The test JVM talks to the hub from the host.
grid.url=http://localhost:4444

# Default browser. Use -Dbrowser=firefox on the command line for another one.
browser=chrome

# ParaBank's HSQLDB database, through the port published on the host.
db.url=jdbc:hsqldb:hsql://localhost:19001/parabank
