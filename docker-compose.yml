services:

  parabank:

    # pinned by digest, so the app does not change if the image is rebuilt
    image: parasoft/parabank:latest@sha256:4a122c72f653edb979b1b84d98c5c7e938b43f22f9e46d8e041de759390982a4

    # web app on 8080; HSQLDB 9001 is published as 19001 to avoid a clash on the host
    ports:
      - "8080:8080"
      - "19001:9001"

    # fixed time zone, so logs and database timestamps are always in UTC
    environment:
      TZ: "UTC"

    # The image has no curl, so the check uses bash /dev/tcp. The first start is slow.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /parabank/services/bank/openapi.json HTTP/1.0\r\n\r\n" >&3; IFS= read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Practice page for features ParaBank does not have (static files served by nginx).
  # The browser in the node container opens http://extras/.
  extras:
    image: nginx:1.31.8-alpine
    volumes:
      - ./src/test/resources/web/extras:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      # Only for opening the page by hand at http://localhost:8081/. Tests do not use this port.
      - "8081:80"

  selenium-hub:
    image: selenium/hub:4.49.0-20260909
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status | jq -e '.value.ready == true' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  chrome:
    image: selenium/node-chrome:4.49.0-20260909
    ports:
      # noVNC on 7900, to watch the browser while a test runs.
      - "7900:7900"
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_NODE_MAX_SESSIONS=2
    depends_on:
      selenium-hub:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status | grep -q '\"ready\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  firefox:
    image: selenium/node-firefox:4.49.0-20260909
    profiles: ["firefox"]                 # off for now: the laptop has 7.6 GB of memory
    ports:
      # Each node serves noVNC on 7900 inside its container, so the host port must be different.
      - "7901:7900"
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
    depends_on:
      selenium-hub:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status | grep -q '\"ready\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  edge:
    image: selenium/node-edge:4.49.0-20260909
    ports:
      - "7902:7900"
    profiles: ["edge"]                    # not started by default
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
    depends_on:
      selenium-hub:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status | grep -q '\"ready\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s