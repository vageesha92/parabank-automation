name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  api-suite:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    permissions:
      contents: read

    steps:

      - name: Get the code
        uses: actions/checkout@v7

      - name: Install JDK 21 and cache the Maven repository
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start the stack and wait until each service is healthy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Run the API suite
        run: ./mvnw -B verify -Dsuite=api

      - name: Save the container logs
        if: always()
        run: mkdir -p target && docker compose logs --no-color > target/compose.log

      - name: Upload the container logs on a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-log
          path: target/compose.log
          retention-days: 7

      - name: Stop the stack and delete its volumes
        if: always()
        run: docker compose down -v
